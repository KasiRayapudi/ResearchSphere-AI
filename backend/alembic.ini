; Alembic configuration.
;
; sqlalchemy.url is deliberately absent: the URL comes from DATABASE_URL via
; alembic/env.py, so migrations always run against the same database the
; application is configured for and no credentials are committed here.

[alembic]
script_location = alembic
prepend_sys_path = .

; Revision files are named <timestamp>_<slug> so `ls versions/` reads in
; chronological order, which a bare hash does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
; Generated revisions go through the same formatters as the rest of the
; codebase, so a fresh autogenerate does not fail `black --check` in CI.
hooks = black,isort
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
isort.type = console_scripts
isort.entrypoint = isort
isort.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
