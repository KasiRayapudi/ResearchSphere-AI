apiVersion: 1

providers:
  - name: ResearchSphere
    orgId: 1
    folder: ResearchSphere
    type: file
    disableDeletion: false
    # Dashboards are provisioned from disk, so edits made in the UI are
    # overwritten on restart. Change the JSON, not the UI.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
