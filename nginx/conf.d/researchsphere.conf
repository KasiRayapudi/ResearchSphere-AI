###############################################################################
# ResearchSphere AI - edge virtual host, plain HTTP.
#
# This is the default: it serves the application over port 80 and terminates no
# TLS. It is what the CI deployment tests and every deployment so far exercise.
#
# To serve HTTPS instead, replace this file with the TLS variant and supply
# certificates -- see nginx/tls/researchsphere-tls.conf and "9. Nginx and TLS"
# in docs/DEPLOYMENT.md. The two are alternatives rather than additions: both
# declare a default server on port 80, so nginx refuses to start with both
# present.
#
# All application routing lives in conf.d/locations.inc, included by this
# server and by the TLS one, so there is a single definition of every route.
# The upstreams and the shared proxy headers are in nginx.conf, at http level.
###############################################################################

server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge. Kept here so certificate issuance works before
    # TLS is switched on; the TLS variant keeps it for renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/conf.d/locations.inc;
}
