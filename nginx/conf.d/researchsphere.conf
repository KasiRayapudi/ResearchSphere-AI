###############################################################################
# ResearchSphere AI - edge virtual host.
#
# HTTPS is ready but not forced on by default: with no certificate mounted,
# enabling the TLS server block would stop nginx from starting at all. See
# "HTTPS" in docs/DEPLOYMENT.md - drop certificates into nginx/certs/ and
# uncomment the redirect and the 443 block below.
###############################################################################

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:8080;
    keepalive 16;
}

# Shared proxy behaviour.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Propagate the correlation id the backend already logs against; generate one
# at the edge when the client did not supply it.
proxy_set_header X-Request-ID $request_id;

server {
    listen 80;
    server_name _;

    # --- HTTPS redirect -----------------------------------------------------
    # Uncomment together with the 443 block once certificates are mounted.
    # location / { return 301 https://$host$request_uri; }

    # ACME HTTP-01 challenge, served before any redirect so certificate
    # issuance and renewal keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Edge health --------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # --- Chat streaming -----------------------------------------------------
    # Must come before the generic /api/ block. Server-sent events break under
    # nginx's default response buffering: the whole stream is held until the
    # response completes, so tokens arrive in one burst at the end instead of
    # incrementally.
    location /api/v1/chat/stream {
        proxy_pass http://backend_upstream;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
        # Generation can legitimately run for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Authentication -----------------------------------------------------
    # Tighter edge limit; the backend applies its own per-account limits too.
    location ~ ^/api/v1/auth/(login|signup|refresh|password-reset) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 30s;
    }

    # --- Uploads ------------------------------------------------------------
    # Ingestion (extract, chunk, embed, upsert) is synchronous server-side and
    # can exceed the default 60s proxy timeout on a large PDF.
    location /api/v1/documents/upload {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_upstream;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64m;
    }

    # --- Long-running agent workflows --------------------------------------
    location ~ ^/api/v1/(reports/generate|research/start) {
        proxy_pass http://backend_upstream;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 60s;
    }

    # --- API documentation --------------------------------------------------
    # Reachable but rate limited. Set DOCS_INTERNAL_ONLY by replacing this with
    # a deny/allow pair if the schema should not be public.
    location ~ ^/(docs|redoc|openapi\.json) {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
    }

    # --- Frontend -----------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 30s;
    }
}

###############################################################################
