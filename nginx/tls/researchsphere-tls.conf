###############################################################################
# ResearchSphere AI - edge virtual host, HTTPS.
#
# Not loaded from here. nginx.conf includes /etc/nginx/conf.d/*.conf, and this
# file lives outside conf.d so that TLS is opt-in: a 443 server whose
# ssl_certificate does not exist stops nginx from starting at all.
#
# To enable TLS:
#
#   1. put fullchain.pem and privkey.pem in nginx/certs/
#   2. cp nginx/tls/researchsphere-tls.conf nginx/conf.d/
#   3. rm nginx/conf.d/researchsphere.conf
#   4. uncomment the 443 port mapping in docker-compose.prod.yml
#   5. set SERVER_NAME below to the real hostname
#
# Step 3 is required, not tidying: researchsphere.conf also declares a default
# server on port 80, and nginx refuses to start with two. To go back, reverse
# the two file operations.
#
# Routing is NOT duplicated here -- both vhosts include conf.d/locations.inc.
# The upstreams and shared proxy headers are in nginx.conf, at http level.
#
# HSTS is deliberately NOT set here. The application owns it
# (SecurityHeadersMiddleware), which emits it only on an https request and
# only when ENVIRONMENT=production. Adding it at the edge as well would put two
# Strict-Transport-Security headers on every proxied response. See
# docs/DEPLOYMENT.md for why the application is the owner.
###############################################################################

# --- Plain HTTP: challenge, health, and redirect ----------------------------
# A server of its own rather than a `location /` added to the application
# vhost: the application vhost already defines `location /` for the SPA, and a
# second one in the same server is a duplicate-location error. Separating the
# servers also means the redirect genuinely covers every path, instead of only
# the ones that happen to fall through to `location /`.
server {
    listen 80;
    server_name _;

    # Served before the redirect so issuance and renewal keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Left on plain HTTP for the container healthcheck, which probes
    # http://127.0.0.1/healthz. Answered by nginx itself, so it exposes
    # nothing: no proxy_pass, no upstream, a literal 200.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Everything else. 301 is permanent and cacheable, and the method is
    # preserved for the GET/HEAD navigations that reach an edge over http;
    # the API and the socket are not expected to arrive here at all, because
    # the SPA is loaded over https and issues relative requests.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the application -------------------------------------------------
server {
    listen 443 ssl;
    http2 on;

    # Replace with the deployment hostname; it must also appear in
    # TRUSTED_HOSTS, and its https origin in CORS_ORIGINS and FRONTEND_URL.
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. Everything older is disabled by omission: nginx
    # enables exactly the versions listed here.
    ssl_protocols TLSv1.2 TLSv1.3;

    # No explicit ssl_ciphers. OpenSSL's own default list for these two
    # protocol versions is already modern, and pinning a hand-written list
    # here would freeze it against future OpenSSL updates. TLS 1.3 ignores
    # ssl_ciphers entirely. ssl_prefer_server_ciphers off leaves the choice
    # with the client, which is the current recommendation.
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling needs a resolver and a certificate chain that includes the
    # issuer, so it is left off here rather than configured half-way. Turn it
    # on together with a `resolver` line once the real certificate is in place.

    include /etc/nginx/conf.d/locations.inc;
}
