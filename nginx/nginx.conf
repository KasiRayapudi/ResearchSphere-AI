###############################################################################
# Edge reverse proxy - global configuration.
# Virtual hosts live in conf.d/.
###############################################################################
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access logs, so proxy logs can be shipped alongside the
    # application's JSON logs without a second parser.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Do not advertise the nginx version.
    server_tokens off;

    # Must accommodate the backend's MAX_UPLOAD_SIZE_MB (50 MB default); the
    # backend enforces the real limit and returns 413, but nginx would
    # otherwise reject the request first with its own opaque error.
    client_max_body_size 64m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Rate limiting zones. The backend has its own Redis-backed limiter; this
    # is a coarse edge guard that sheds obvious floods before they reach it.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # WebSocket upgrades. `Upgrade` and `Connection` are hop-by-hop headers,
    # so nginx drops them unless they are set again explicitly; without this
    # the backend receives a plain GET on its WebSocket route and the
    # handshake fails. The map keeps the same proxy configuration usable for
    # ordinary requests, where $http_upgrade is empty and the connection must
    # be closed rather than upgraded.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ----------------------------------------------------------- upstreams --
    # Declared here rather than in a vhost file because they are http-level
    # and shared: the plain-HTTP vhost and the TLS vhost are alternatives
    # (see nginx/tls/), and whichever one is active needs these.
    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:8080;
        keepalive 16;
    }

    # ----------------------------------------------- shared proxy defaults --
    # http-level for the same reason as the upstreams above. Individual
    # locations that set any proxy_set_header of their own must repeat every
    # header they still need -- nginx inherits proxy_set_header from the
    # enclosing level only when the current level sets none at all. The SSE
    # and WebSocket locations in conf.d/locations.inc do exactly that, and
    # say so.
    #
    # X-Forwarded-Proto carries $scheme, so it is "http" from the port-80
    # server and "https" from the TLS server with no further configuration.
    # The backend reads it through uvicorn's --proxy-headers and uses it to
    # decide whether to emit HSTS.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Propagate the correlation id the backend already logs against; generate
    # one at the edge when the client did not supply it.
    proxy_set_header X-Request-ID $request_id;

    include /etc/nginx/conf.d/*.conf;
}
