###############################################################################
# Edge reverse proxy - global configuration.
# Virtual hosts live in conf.d/.
###############################################################################
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access logs, so proxy logs can be shipped alongside the
    # application's JSON logs without a second parser.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Do not advertise the nginx version.
    server_tokens off;

    # Must accommodate the backend's MAX_UPLOAD_SIZE_MB (50 MB default); the
    # backend enforces the real limit and returns 413, but nginx would
    # otherwise reject the request first with its own opaque error.
    client_max_body_size 64m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Rate limiting zones. The backend has its own Redis-backed limiter; this
    # is a coarse edge guard that sheds obvious floods before they reach it.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    include /etc/nginx/conf.d/*.conf;
}
