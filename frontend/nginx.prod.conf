# Static asset server for the built SPA.
#
# This container serves files only. API routing, TLS and rate limiting live in
# the edge proxy (nginx/conf.d/researchsphere.conf), so nothing here needs to
# know about the backend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requests arrive from the edge proxy, so the real client address is in
    # X-Forwarded-For rather than $remote_addr.
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for","request":"$request",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"referrer":"$http_referer","user_agent":"$http_user_agent",'
        '"request_time":$request_time}';
    access_log /var/log/nginx/access.log json_combined;

    # Container healthcheck target; must not be logged or cached.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff font/woff2;

    # Fingerprinted assets are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading an old bundle
    # that references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here should ever serve a dotfile.
    location ~ /\. {
        deny all;
        access_log off;
    }
}
