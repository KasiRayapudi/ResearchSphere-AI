version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # config.py reads a full SQLAlchemy URL, not POSTGRES_* pieces.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/researchsphere_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # config.py reads REDIS_URL, not REDIS_HOST/REDIS_PORT.
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,backend}
      - UPLOAD_DIR=/app/uploads
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # No insecure default: fail fast if SECRET_KEY is not supplied.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
    volumes:
      # Without this, uploaded source files are lost on every restart while
      # their database rows and Qdrant vectors survive.
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - qdrant
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=researchsphere_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
