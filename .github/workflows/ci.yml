name: CI

on:
  push:
    branches: [main, develop, "sprint-*", "step-*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: nothing is gained by
# finishing CI for a commit that has already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.11"
  NODE_DEFAULT: "20"

jobs:
  # ---------------------------------------------------------------- backend --
  backend-quality:
    name: Backend quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Formatting and lint are blocking: they are deterministic and every
      # finding is mechanically fixable.
      - name: Black (formatting)
        working-directory: backend
        run: black --check --diff .

      - name: isort (import order)
        working-directory: backend
        run: isort --check-only --diff .

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check --output-format=github .

      # MyPy is advisory. The codebase predates type annotations and currently
      # reports ~66 errors, mostly FastAPI handler-signature variance. The
      # report is published as an artifact so the backlog stays visible.
      - name: MyPy (types, advisory)
        id: mypy
        working-directory: backend
        continue-on-error: true
        run: mypy app main.py --no-error-summary > mypy-report.txt 2>&1 || true

      - name: Upload MyPy report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: backend/mypy-report.txt
          retention-days: 14

  backend-tests:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # A real Redis, the image docker-compose.yml runs, for the one step below
    # that needs it. The main suite uses fakeredis and never touches it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite provisions its own SQLite database and fakeredis, and asserts
      # that Qdrant- and Gemini-dependent paths degrade rather than crash. The
      # real-Redis tests in it are skipped here; the next step runs them.
      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            --junitxml=junit.xml

      # fakeredis cannot show what breaks a pub/sub subscriber in production --
      # read timeouts on a quiet channel, killed connections, a server that
      # stops answering. This runs the realtime layer against the real thing.
      # It passes only if tests ran and none failed, errored or was skipped
      # (counted from JUnit XML, not read off the log), and nothing was left
      # for the garbage collector to close.
      - name: Realtime against a real Redis
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          REALTIME_REDIS_URL: redis://localhost:6379/15
        run: |
          set -o pipefail
          pytest tests/test_realtime_redis.py -m redis -rfEs \
            -W error::pytest.PytestUnraisableExceptionWarning \
            --junitxml=realtime-redis.xml 2>&1 | tee realtime-redis.log
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("realtime-redis.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          n = {key: int(suite.get(key, 0)) for key in ("tests", "failures", "errors", "skipped")}
          passed = n["tests"] - n["failures"] - n["errors"] - n["skipped"]
          summary = (
              f"{n['tests']} tests: {passed} passed, {n['failures']} failed, "
              f"{n['errors']} errors, {n['skipped']} skipped"
          )
          print(f"::notice title=Realtime on real Redis (py${{ matrix.python-version }})::{summary}")
          if n["tests"] == 0 or n["skipped"] or n["failures"] or n["errors"]:
              print(f"::error::Real-Redis tests did not all run and pass: {summary}")
              sys.exit(1)
          PY
          if grep -nE "Exception ignored in|Event loop is closed|unclosed Connection|Unclosed client" realtime-redis.log; then
            echo "::error::A Redis connection was left for the garbage collector to close (see lines above)"
            exit 1
          fi

      - name: Upload coverage and test reports
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/junit.xml
          retention-days: 14

      - name: Publish coverage summary
        if: matrix.python-version == '3.11'
        working-directory: backend
        run: |
          {
            echo "### Backend coverage"
            echo ""
            coverage report --format=markdown || coverage report
          } >> "$GITHUB_STEP_SUMMARY"

  backend-config:
    name: Backend configuration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The same validator the container entrypoint runs. Proves both that a
      # correct production configuration passes and that an incomplete one is
      # rejected - a validator that never fails is not a validator.
      - name: Production config must be accepted when complete
        working-directory: backend
        env:
          ENVIRONMENT: production
          SECRET_KEY: ci-only-secret-key-long-enough-for-validation-1234
          GEMINI_API_KEY: ci-placeholder
          DATABASE_URL: postgresql://user:pass@db:5432/researchsphere
          REDIS_URL: redis://redis:6379
          FRONTEND_URL: https://app.example.com
          CORS_ORIGINS: https://app.example.com
          TRUSTED_HOSTS: app.example.com
          DEBUG: "false"
        run: python -m app.cli.validate_config

      - name: Production config must be rejected when incomplete
        working-directory: backend
        env:
          ENVIRONMENT: production
        run: |
          if python -m app.cli.validate_config; then
            echo "::error::Validator accepted an invalid production configuration"
            exit 1
          fi
          echo "Validator correctly rejected the incomplete configuration."

  # --------------------------------------------------------------- frontend --
  frontend:
    name: Frontend (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings 200 --format stylish

      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # `npm run build` type-checks before bundling, so a type error fails here
      # as well as in the dedicated step above.
      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage
        if: always() && matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Upload built assets
        if: matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------------- docker --
  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Images are built but not pushed here; publishing happens in release.yml.
      # GitHub Actions cache keeps rebuild times reasonable despite the large
      # ML dependency tree in the backend image.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: researchsphere/backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: researchsphere/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # A built image that cannot start is not a passing build.
      - name: Backend image starts and validates its configuration
        run: |
          docker run --rm \
            -e ENVIRONMENT=development \
            -e SKIP_DEPENDENCY_WAIT=true \
            researchsphere/backend:ci validate

      - name: Backend image runs as a non-root user
        run: |
          user="$(docker run --rm --entrypoint sh researchsphere/backend:ci -c 'id -u')"
          if [ "$user" = "0" ]; then
            echo "::error::Backend image runs as root"
            exit 1
          fi
          echo "Backend image UID: $user"

      - name: Frontend image serves its health endpoint
        run: |
          docker run -d --name fe -p 8080:8080 researchsphere/frontend:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "Frontend healthy."
              docker rm -f fe
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend image did not become healthy"
          docker logs fe
          docker rm -f fe
          exit 1

      - name: Report image sizes
        run: |
          {
            echo "### Image sizes"
            echo ""
            echo '```'
            docker images researchsphere/backend:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
            docker images researchsphere/frontend:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- e2e --
  # The unit suites prove the pieces; this proves the product. A real browser
  # drives the frontend against a real API, Postgres, Redis, Qdrant and a Celery
  # worker, so an upload travels the same path it does in production. Nothing
  # here is mocked or stubbed, and nothing is allowed to skip: if a service is
  # missing, the Playwright global setup fails the job before the first test
  # runs. The frontend is served by the Vite dev server, whose proxy makes /api
  # and the WebSocket upgrade same-origin exactly as the production reverse
  # proxy does; the production bundle is covered by the Docker job above.
  #
  # The suite runs as two legs, each against its own complete stack. That is
  # not for speed: the API allows 20 requests a minute per client IP across
  # /auth/* and /upload, every leg's traffic comes from one IP, and one leg
  # running every spec would exceed it. Separate stacks mean separate rate
  # limit windows, with the limit itself untouched. Which spec runs where is
  # set once, in E2E_CORE_SPECS and E2E_REALTIME_SPECS below, and the first
  # step fails the job if any spec file is in neither list or in both.
  e2e:
    name: End-to-end (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    strategy:
      fail-fast: false
      matrix:
        suite: [core, realtime]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: researchsphere_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d researchsphere_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # The image carries no shell utilities to probe itself with, so this one
      # is waited for from the runner instead of by a container health check.
      qdrant:
        image: qdrant/qdrant:v1.8.0
        ports:
          - 6333:6333

    env:
      # The defaults in config.py already point at localhost on these ports,
      # but an end-to-end job should state what it is testing against.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/researchsphere_db
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      # A non-empty REDIS_URL is what routes ingestion through Celery and the
      # realtime broker through Redis pub/sub rather than the inline fallbacks.
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
      VIRUS_SCANNER: noop
      UPLOAD_DIR: ${{ github.workspace }}/e2e-uploads
      QUARANTINE_DIR: ${{ github.workspace }}/e2e-uploads/.quarantine
      # Every spec in frontend/e2e belongs to exactly one of these.
      E2E_CORE_SPECS: auth.spec.ts upload.spec.ts indexing.spec.ts
      E2E_REALTIME_SPECS: realtime.spec.ts reconnect.spec.ts

    steps:
      - uses: actions/checkout@v4

      # A spec in neither list would never run anywhere, and nothing else would
      # notice; one in both would double this leg's share of the rate limit.
      - name: Every spec belongs to exactly one suite
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          present = sorted(p.name for p in pathlib.Path("frontend/e2e").glob("*.spec.ts"))
          core = os.environ["E2E_CORE_SPECS"].split()
          realtime = os.environ["E2E_REALTIME_SPECS"].split()
          assigned = core + realtime
          problems = []
          for name in present:
              if assigned.count(name) != 1:
                  problems.append(f"{name} is assigned {assigned.count(name)} times")
          for name in assigned:
              if name not in present:
                  problems.append(f"{name} is assigned but does not exist")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"{len(present)} specs, each in exactly one suite")
          PY

      - name: Select this suite's specs
        run: |
          case "${{ matrix.suite }}" in
            core) specs="$E2E_CORE_SPECS" ;;
            realtime) specs="$E2E_REALTIME_SPECS" ;;
            *) echo "::error::unknown suite ${{ matrix.suite }}"; exit 1 ;;
          esac
          echo "E2E_SPECS=$specs" >> "$GITHUB_ENV"
          echo "suite ${{ matrix.suite }}: $specs"

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node ${{ env.NODE_DEFAULT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEFAULT }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Waited for here rather than by a service health check (see above). The
      # loop asks the server itself, so it neither starts early nor sleeps for
      # a fixed guess.
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:6333/collections >/dev/null 2>&1; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Qdrant did not become ready"
          exit 1

      # A secret only this job ever sees, so no fixed key is committed and none
      # has to be provisioned for CI to run.
      - name: Generate a run-scoped SECRET_KEY
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Apply database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      # The worker downloads the embedding model on its first task. Pulling it
      # here keeps a cold cache out of the test timeouts; it is the same model
      # the pipeline uses, fetched early, not a substitute for it.
      - name: Warm the embedding model cache
        working-directory: backend
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Start the API
        working-directory: backend
        run: |
          mkdir -p "$UPLOAD_DIR" "$QUARANTINE_DIR"
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 --log-level info             > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/api.pid"

      - name: Start the Celery worker
        working-directory: backend
        run: |
          python -m celery -A app.worker.celery_app:celery_app worker             --loglevel info --concurrency 2 --hostname "ingest@%h" --queues celery             > "$GITHUB_WORKSPACE/worker.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/worker.pid"

      # Waiting for the API directly, before the browser is involved, so that a
      # backend that failed to start is reported as exactly that rather than as
      # an unreachable proxy. /api/live is exempt from rate limiting.
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/live >/dev/null 2>&1; then
              echo "API is live"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API did not come up"
          tail -n 100 "$GITHUB_WORKSPACE/api.log"
          exit 1

      # A worker that never started would leave every document sitting in
      # `queued`, which some assertions accept -- the job would look green while
      # nothing was processed. Asking the worker to answer rules that out.
      - name: Wait for the Celery worker
        working-directory: backend
        run: |
          for _ in $(seq 1 45); do
            if python -m celery -A app.worker.celery_app:celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong; then
              echo "Celery worker answered"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The Celery worker did not answer a ping"
          tail -n 100 "$GITHUB_WORKSPACE/worker.log"
          exit 1

      # Playwright starts the frontend itself (webServer in playwright.config.ts)
      # and its global setup blocks until the API reports database, redis and
      # qdrant reachable, failing the job if any of them is not.
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          CI: "true"
        # Word-split on purpose: one filter argument per spec file. A filter
        # that matches nothing makes Playwright fail with "No tests found".
        run: npm run test:e2e -- $E2E_SPECS

      # A green test says the UI showed `indexed`. This says *why* it could:
      # that the task left the API for the broker, that the worker process (not
      # the API's inline fallback) ran it, that the embedding stage executed,
      # and that Qdrant holds points for this exact document. A healthy worker
      # and a healthy Qdrant would prove none of that, so nothing here looks at
      # service health -- it looks for this document id.
      - name: Prove the indexing pipeline ran
        if: contains(format(' {0} ', env.E2E_SPECS), ' indexing.spec.ts ')
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.request

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence_path = workspace / "frontend" / "test-results" / "indexed-document.json"
          if not evidence_path.exists():
              sys.exit(f"::error::The indexed test left no evidence at {evidence_path}")

          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          document_id = evidence["documentId"]
          api_log = (workspace / "api.log").read_text(encoding="utf-8", errors="replace")
          worker_log = (workspace / "worker.log").read_text(encoding="utf-8", errors="replace")

          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          # 1. The API handed the task to the broker instead of doing it itself.
          require(
              f"Queued document {document_id} for indexing" in api_log,
              f"the API never queued {document_id} to the broker",
          )
          for inline in ("is being indexed inline", "indexing inline instead"):
              require(
                  inline not in api_log,
                  f"the API fell back to inline ingestion ({inline!r}) -- Celery did not do this work",
              )

          # 2. The worker process ran it, and got as far as the vector write.
          require(
              document_id in worker_log,
              f"the worker log has no record of {document_id}",
          )
          require(
              f"vectors for document {document_id}" in worker_log,
              f"the worker never upserted vectors for {document_id}",
          )
          require(
              "Embedding model loaded successfully" in worker_log,
              "the worker never loaded the embedding model",
          )

          # 3. Qdrant itself holds points carrying this document id.
          # Asked of the application's own settings, so this cannot drift from
          # the collection the worker actually wrote to.
          from app.core.config import settings

          collection = settings.QDRANT_COLLECTION
          request = urllib.request.Request(
              f"http://localhost:6333/collections/{collection}/points/scroll",
              data=json.dumps(
                  {
                      "filter": {"must": [{"key": "document_id", "match": {"value": document_id}}]},
                      "limit": 100,
                      "with_payload": True,
                  }
              ).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              scrolled = json.loads(response.read())
          points = scrolled.get("result", {}).get("points", [])
          require(points, f"Qdrant holds no points for document {document_id}")
          require(
              all(p.get("payload", {}).get("document_id") == document_id for p in points),
              "Qdrant returned points belonging to another document",
          )
          # At least one point per chunk. A retried ingest writes fresh point
          # ids and leaves the previous attempt's points behind, so more than
          # the chunk count means a retry happened, not that indexing is wrong.
          require(
              len(points) >= evidence["chunkCountApi"],
              f"Qdrant holds {len(points)} points but the API reports "
              f"{evidence['chunkCountApi']} chunks",
          )
          if len(points) > evidence["chunkCountApi"]:
              print(
                  f"::warning::Qdrant holds {len(points)} points for "
                  f"{evidence['chunkCountApi']} chunks; an earlier attempt was retried"
              )

          summary = (
              f"document {document_id}: {evidence['chunkCountApi']} chunks, "
              f"{len(points)} Qdrant points, upload to indexed in "
              f"{evidence['uploadToIndexedMs']}ms "
              f"(worker {evidence['processingStartedAt']} -> {evidence['processingCompletedAt']})"
          )
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(f"The indexed journey could not be corroborated. {summary}")
          print(f"::notice title=Indexed journey::{summary}")
          PY

      # The indexed journey above says the pipeline finished. This says the
      # browser was told: that a document.status frame for this exact document
      # arrived on the application's own socket before the row changed, and
      # that the one REST endpoint which could have produced the same result
      # was not being polled. A missing file means the realtime test did not
      # run, which fails the job rather than passing quietly.
      - name: Prove the realtime path delivered the update
        if: contains(format(' {0} ', env.E2E_SPECS), ' realtime.spec.ts ')
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = (
              pathlib.Path(os.environ["GITHUB_WORKSPACE"])
              / "frontend"
              / "test-results"
              / "realtime-document.json"
          )
          if not path.exists():
              sys.exit(f"::error::The realtime test left no evidence at {path}")

          e = json.loads(path.read_text(encoding="utf-8"))
          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          require(
              e["indexedFrameStatus"] == "indexed",
              f"the observed frame carried {e['indexedFrameStatus']!r}, not 'indexed'",
          )
          require(
              e["nonTerminalFrames"] >= 1,
              "the browser never saw a non-terminal status frame, so no transition was observed",
          )
          require(
              e["frameToDomMs"] >= 0,
              "the DOM showed indexed before the frame arrived, so the event did not cause it",
          )
          require(
              e["statusEndpointRequestsWhileWaiting"] <= 1,
              f"the UI called the status endpoint "
              f"{e['statusEndpointRequestsWhileWaiting']} times while waiting: that is polling",
          )
          require(
              e["restCorroboratedStatus"] == "indexed" and e["restChunkCount"] > 0,
              f"REST disagreed with the UI: {e['restCorroboratedStatus']!r}, "
              f"{e['restChunkCount']} chunks",
          )
          require("/api/v1/ws" in (e.get("socketUrl") or ""), "no application WebSocket was recorded")

          summary = (
              f"document {e['documentId']}: {e['statusFramesForDocument']} status frames "
              f"({e['nonTerminalFrames']} non-terminal), upload to indexed frame "
              f"{e['uploadToIndexedFrameMs']}ms, frame to DOM {e['frameToDomMs']}ms, "
              f"status-endpoint requests while waiting: "
              f"{e['statusEndpointRequestsWhileWaiting']}, REST {e['restCorroboratedStatus']} "
              f"with {e['restChunkCount']} chunks"
          )
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(f"The realtime path could not be corroborated. {summary}")
          print(f"::notice title=Realtime update::{summary}")
          PY

      # The realtime step above proves events arrive on a healthy socket. This
      # proves a broken one recovers: that the initial socket really ended, the
      # client retried on its own, resumed in the same sequence space, and the
      # server replayed -- completely -- the indexing it missed, so the row
      # caught up from a replayed frame with no reload, no refetch and no REST
      # read after the reconnect. A missing file means the test did not run.
      - name: Prove the reconnect recovered what it missed
        if: contains(format(' {0} ', env.E2E_SPECS), ' reconnect.spec.ts ')
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = (
              pathlib.Path(os.environ["GITHUB_WORKSPACE"])
              / "frontend"
              / "test-results"
              / "reconnect-document.json"
          )
          if not path.exists():
              sys.exit(f"::error::The reconnect test left no evidence at {path}")

          e = json.loads(path.read_text(encoding="utf-8"))
          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          require(e["initialSocketClosed"], "the initial application socket never closed")
          require(e["applicationSockets"] == 2, f"expected 2 application sockets, saw {e['applicationSockets']}")
          require(e["otherSocketCloses"] == 0, "a socket other than /api/v1/ws was interrupted")
          require(e["reconnectAttemptAfterCloseMs"] >= 0, "the retry did not follow the close")
          require(e["resumeSent"] and e["resumeEpochMatches"], "the client did not resume in the same epoch")
          require(e["resumedComplete"], "the server reported the resume incomplete")
          require(e["resumedReplayed"] > 0, "the server replayed nothing")
          require(e["indexedFrameOnNewSocket"], "no indexed frame for the document arrived on the new socket")
          require(e["backendStatusWhileDown"] == "indexed", "the backend was not indexed during the outage")
          require(
              e["rowStatusWhileDown"] in ("queued", "processing"),
              f"the row showed {e['rowStatusWhileDown']!r} while the socket was down",
          )
          require(e["frameToDomMs"] >= 0, "the DOM changed before the replayed frame arrived")
          require(
              e["statusReadsWhileDown"] == 1,
              f"expected the one documented status read during the outage, saw {e['statusReadsWhileDown']}",
          )
          require(e["statusReadsAfterReconnect"] == 0, "the UI read the status endpoint after reconnecting")
          require(e["listRequestsAfterReconnect"] == 0, "the UI refetched the document list after reconnecting")
          require(e["documentLoadsDuringTest"] == 0, "the page reloaded during recovery")
          require(
              e["restStatus"] == "indexed" and e["restChunkCount"] > 0,
              f"REST disagreed: {e['restStatus']!r}, {e['restChunkCount']} chunks",
          )

          summary = (
              f"document {e['documentId']}: socket dropped, retry {e['reconnectAttemptAfterCloseMs']}ms "
              f"after close; resumed after seq {e['resumeAfter']} with {e['resumedReplayed']} replayed "
              f"(complete={e['resumedComplete']}); restore to indexed frame "
              f"{e['restoreToIndexedFrameMs']}ms, frame to DOM {e['frameToDomMs']}ms; status reads "
              f"{e['statusReadsWhileDown']} during outage / {e['statusReadsAfterReconnect']} after"
          )
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(f"The reconnect could not be corroborated. {summary}")
          print(f"::notice title=Reconnect recovery::{summary}")
          PY

      - name: Show service logs
        if: always()
        run: |
          for name in api worker; do
            echo "::group::$name log"
            if [ -f "$GITHUB_WORKSPACE/$name.log" ]; then
              tail -n 200 "$GITHUB_WORKSPACE/$name.log"
            else
              echo "no $name.log was written"
            fi
            echo "::endgroup::"
          done

      - name: Stop background services
        if: always()
        run: |
          for name in api worker; do
            pidfile="$GITHUB_WORKSPACE/$name.pid"
            [ -f "$pidfile" ] || continue
            if kill "$(cat "$pidfile")" 2>/dev/null; then
              echo "stopped $name"
            else
              echo "$name was no longer running"
            fi
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # ------------------------------------------------------------------- gate --
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [backend-quality, backend-tests, backend-config, frontend, docker-build, e2e]
    steps:
      # A single required status check for branch protection. Without this,
      # protection rules have to enumerate every matrix leg by name.
      - name: Fail if any job failed
        run: |
          if echo '${{ join(needs.*.result, ',') }}' | grep -qE 'failure|cancelled'; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
