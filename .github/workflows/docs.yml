name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openapi:
    name: Export OpenAPI schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      # Generated from the live application, so it can never drift from the
      # routes that actually exist.
      - name: Generate schema
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./openapi-export.db
        run: |
          python - <<'PY'
          import json
          from main import app

          schema = app.openapi()
          with open("openapi.json", "w", encoding="utf-8") as handle:
              json.dump(schema, handle, indent=2)

          paths = schema.get("paths", {})
          operations = sum(len(methods) for methods in paths.values())
          print(f"{len(paths)} paths, {operations} operations")

          with open("openapi-summary.md", "w", encoding="utf-8") as handle:
              handle.write("# API surface\n\n")
              handle.write(f"- Paths: {len(paths)}\n- Operations: {operations}\n\n")
              handle.write("| Method | Path | Summary |\n|---|---|---|\n")
              for path, methods in sorted(paths.items()):
                  for method, spec in sorted(methods.items()):
                      summary = spec.get("summary", "").replace("|", "\|")
                      handle.write(f"| `{method.upper()}` | `{path}` | {summary} |\n")
          PY

      - name: Publish summary
        working-directory: backend
        run: cat openapi-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: |
            backend/openapi.json
            backend/openapi-summary.md
          retention-days: 30

  dependency-graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependency tree
        working-directory: backend
        run: |
          pip install pipdeptree -r requirements.txt
          pipdeptree --json-tree > dependency-tree.json
          pipdeptree > dependency-tree.txt

      - name: Frontend module graph
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          # madge renders the internal import graph; a cycle here is a design
          # problem worth seeing, so it is reported explicitly.
          npx --yes madge --extensions ts,tsx --json src > module-graph.json
          npx --yes madge --extensions ts,tsx --circular src > circular.txt || true

      - name: Publish summary
        run: |
          {
            echo "### Circular imports (frontend)"
            echo ""
            echo '```'
            cat frontend/circular.txt 2>/dev/null || echo "none reported"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graphs
          path: |
            backend/dependency-tree.json
            backend/dependency-tree.txt
            frontend/module-graph.json
            frontend/circular.txt
          retention-days: 30

  coverage-report:
    name: Publish coverage reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=html --cov-report=term -q

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            backend/htmlcov/
            frontend/coverage/
          retention-days: 30
