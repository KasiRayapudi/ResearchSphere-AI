name: Release deployment verification

# Deploys a published release the way an operator would: on a bare Linux host
# holding nothing but `deploy-<version>.tar.gz`, with the images pulled from
# GHCR rather than built. That is the one path CI could never cover before --
# the `prod-stack` job in ci.yml builds the images locally and reads `nginx/`
# from the repository checkout, so it proves the topology works but not that
# the published artefacts alone are sufficient, and it never performs a real
# registry pull.
#
# Deliberately no actions/checkout: a checkout would supply `nginx/` and the
# `Makefile` for free and make the whole exercise meaningless. The job asserts
# the workspace is bare before it starts.
#
# Two jobs run against the same published bundle:
#
#   clean-host      the HTTP edge, which every release ships. Unchanged
#                   since v1.0.1 was verified with it.
#   clean-host-tls  the HTTPS/WSS edge, which first shipped in v1.1.0.
#                   It applies the two file operations and the one
#                   uncomment that docs/DEPLOYMENT.md section 9 asks an
#                   operator to perform, supplies an ephemeral
#                   certificate, and then proves by checksum that the
#                   configuration nginx loaded is the published bundle's
#                   own bytes.
#
# clean-host-tls is skipped, not failed, for releases that predate the
# TLS edge: v1.0.x is immutable and carries no TLS vhost, so asserting
# one against it would be retrofitting an expectation it never made. The
# decision comes from the tag, never from the bundle -- see release-facts.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (e.g. v1.0.1)"
        required: true

permissions:
  contents: read   # download the release asset
  packages: read   # pull the images from GHCR

jobs:
  clean-host:
    name: Deploy a release on a clean host
    runs-on: ubuntu-latest
    env:
      EDGE: http://localhost
    steps:
      - name: Determine the release under test
        id: release
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::no release tag was supplied"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "verifying release $tag, deploying with IMAGE_TAG=${tag#v}"

      - name: The runner holds no repository checkout
        run: |
          # If anything is here, a later step could read nginx/ or the
          # Makefile from it rather than from the bundle, and the result
          # would prove nothing.
          leftovers="$(ls -A . 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::error::workspace is not empty, so the bundle would not be the only source: $leftovers"
            exit 1
          fi
          echo "workspace is bare; the bundle will be the only source of files"

      - name: Download only the deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.release.outputs.tag }}" --repo "${{ github.repository }}" --pattern 'deploy-*.tar.gz' --dir "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"/deploy-*.tar.gz

      - name: Unpack it, and show exactly what the host receives
        run: |
          mkdir host
          tar -xzf "$RUNNER_TEMP"/deploy-*.tar.gz -C host
          echo "--- everything the host now has ---"
          find host -mindepth 1 | sort
          # Every path docker-compose.prod.yml bind-mounts has to be here, or
          # the nginx service cannot start.
          for path in docker-compose.prod.yml .env.prod.example Makefile nginx/nginx.conf nginx/conf.d/researchsphere.conf nginx/certs; do
            if [ ! -e "host/$path" ]; then
              echo "::error::the bundle is missing $path"
              exit 1
            fi
          done
          echo "all required deployment paths are present"

      - name: Compose a throwaway .env.prod from the template in the bundle
        working-directory: host
        env:
          IMAGE_TAG: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import secrets

          values = {
              "SECRET_KEY": base64.b64encode(secrets.token_bytes(48)).decode(),
              "POSTGRES_PASSWORD": secrets.token_hex(24),
              "REDIS_PASSWORD": secrets.token_hex(24),
              "GEMINI_API_KEY": "ci-not-a-real-key",
              "FRONTEND_URL": "http://localhost",
              "CORS_ORIGINS": "http://localhost",
              "TRUSTED_HOSTS": "localhost",
              # The whole point of this job: a published version, never "local".
              "IMAGE_TAG": os.environ["IMAGE_TAG"],
          }
          out, seen = [], set()
          for line in pathlib.Path(".env.prod.example").read_text().splitlines():
              key = line.split("=", 1)[0] if ("=" in line and not line.startswith("#")) else None
              if key in values:
                  out.append(key + "=" + values[key])
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in values.items():
              if key not in seen:
                  out.append(key + "=" + value)
          pathlib.Path(".env.prod").write_text(chr(10).join(out) + chr(10))

          print("keys written (values withheld):")
          for line in out:
              if "=" in line and not line.startswith("#"):
                  print("  " + line.split("=", 1)[0])
          PY

      - name: Compose parses the bundled file on its own
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod config > /dev/null
          echo "docker-compose.prod.yml parses with no overlay and no source tree"

      - name: Pull the published images from GHCR
        working-directory: host
        run: |
          # The step that has never run before: a real registry pull of the
          # images this release published.
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull

      - name: The pulled images came from GHCR at this version
        working-directory: host
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          failed=0
          for name in backend frontend; do
            ref="ghcr.io/kasirayapudi/researchsphere-ai/$name:$VERSION"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref" 2>/dev/null || true)"
            if [ -z "$digest" ]; then
              echo "::error::$ref is not present locally after the pull"
              failed=1
              continue
            fi
            echo "$name -> $digest"
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "both application images were pulled from GHCR at $VERSION"

      - name: Start the datastores and migrate
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build postgres redis qdrant
          pending="not checked"
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pending=""
            for s in postgres redis qdrant; do
              cid="$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q "$s")"
              if [ -z "$cid" ]; then
                pending="$pending $s=absent"
                continue
              fi
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
              if [ "$state" != "healthy" ]; then
                pending="$pending $s=$state"
              fi
            done
            if [ -z "$pending" ]; then
              echo "datastores healthy"
              break
            fi
            echo "waiting:$pending"
            sleep 5
          done
          if [ -n "$pending" ]; then
            echo "::error::datastores did not become healthy:$pending"
            exit 1
          fi
          docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend migrate

      - name: Start the full stack
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

      - name: Every service reports healthy
        working-directory: host
        run: |
          services="nginx frontend backend worker beat postgres qdrant redis"
          pending="not checked"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pending=""
            for s in $services; do
              cid="$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q "$s")"
              if [ -z "$cid" ]; then
                pending="$pending $s=absent"
                continue
              fi
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
              if [ "$state" != "healthy" ]; then
                pending="$pending $s=$state"
              fi
            done
            if [ -z "$pending" ]; then
              echo "all 8 services healthy"
              docker compose -f docker-compose.prod.yml --env-file .env.prod ps
              exit 0
            fi
            echo "waiting:$pending"
            sleep 5
          done
          echo "::error::services did not become healthy:$pending"
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          exit 1

      - name: The edge serves the SPA and proxies the API
        run: |
          echo "--- nginx own health ---"
          curl --fail --silent --show-error "$EDGE/healthz"
          echo
          echo "--- backend diagnostics through the edge ---"
          curl --fail --silent --show-error "$EDGE/api/health" | head -c 400
          echo
          status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' "$EDGE/api/ready")"
          if [ "$status" != "200" ]; then
            echo "::error::readiness through the edge returned $status"
            exit 1
          fi
          echo "readiness through the edge: $status"
          echo "--- SPA through the edge ---"
          body="$(curl --fail --silent --show-error "$EDGE/")"
          printf '%s' "$body" | grep -qi "<!doctype html"
          echo "index.html served through nginx, $(printf '%s' "$body" | wc -c) bytes"

      - name: The datastores are not reachable from the host
        run: |
          for port in 5432 6379 6333; do
            if curl --silent --max-time 3 "http://127.0.0.1:$port" > /dev/null 2>&1; then
              echo "::error::port $port answered on the host; it must not be published"
              exit 1
            fi
            echo "port $port is not reachable from the host, as intended"
          done

      - name: A WebSocket upgrade survives the edge proxy
        run: |
          python3 -m pip install --quiet "websockets==12.0"
          python3 - <<'PY'
          import asyncio
          import json
          import secrets
          import sys
          import urllib.error
          import urllib.request

          import websockets

          EDGE = "http://localhost"
          UPPER = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          LOWER = "abcdefghijkmnopqrstuvwxyz"
          DIGIT = "23456789"
          SPECIAL = "!@#%^&*"


          def password():
              # Mirrors what the backend policy accepts: alternate a letter
              # and a non-letter so no run of repeats or sequences can form.
              out = []
              for pair in range(8):
                  out.append(secrets.choice(UPPER if pair % 2 == 0 else LOWER))
                  out.append(secrets.choice(DIGIT if pair % 2 == 0 else SPECIAL))
              return "".join(out)


          def call(path, payload=None, token=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(EDGE + path, data=data)
              req.add_header("Content-Type", "application/json")
              req.add_header("Origin", EDGE)
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  sys.exit("%s failed: HTTP %s %s" % (path, exc.code, exc.read().decode()[:300]))

          marker = secrets.token_hex(6)
          created = call("/api/v1/auth/signup", {
              "name": "Clean Host Probe",
              # example.com, never a .test address: .test is a reserved
              # special-use TLD (RFC 6761) and email-validator, which backs
              # pydantic EmailStr, rejects it outright -- signup answers 422
              # and the probe never reaches the socket.
              "email": "clean-host-%s@example.com" % marker,
              "password": password(),
          })
          token = created["access_token"]
          workspace_id = call("/api/v1/workspaces", token=token)[0]["id"]
          print("signed up through the edge; workspace %s" % workspace_id)


          async def probe():
              url = "ws://localhost/api/v1/ws?workspace_id=%s" % workspace_id
              async with websockets.connect(
                  url,
                  subprotocols=["bearer", token],
                  origin=EDGE,
                  open_timeout=30,
                  close_timeout=5,
              ) as socket:
                  print("handshake completed through nginx")
                  print("negotiated subprotocol: %r" % socket.subprotocol)
                  if socket.subprotocol != "bearer":
                      sys.exit("the server did not echo the bearer subprotocol")
                  raw = await asyncio.wait_for(socket.recv(), timeout=30)
                  return json.loads(raw)

          event = asyncio.run(probe())
          if not isinstance(event, dict) or "type" not in event:
              sys.exit("unexpected first frame: %r" % (event,))
          print("first frame through the proxy: %s" % json.dumps(event)[:300])
          print("::notice::Clean-host deployment verified from the release bundle: "
                "images pulled from GHCR, eight services healthy, SPA and API "
                "through nginx, WebSocket upgrade accepted, first event type %r"
                % event["type"])
          PY

      - name: Stack state and logs
        if: always()
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=150 || true

      - name: Tear down
        if: always()
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod down -v --remove-orphans || true

  # ---------------------------------------------------------------- facts --
  release-facts:
    name: Identify the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.facts.outputs.tag }}
      version: ${{ steps.facts.outputs.version }}
      tls_expected: ${{ steps.facts.outputs.tls_expected }}
    steps:
      - name: Read the tag and decide whether TLS applies to it
        id: facts
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::no release tag was supplied"
            exit 1
          fi
          version="${tag#v}"
          # The decision comes from the tag, never from the bundle. A gate
          # that asked the artefact whether it contains TLS files would skip
          # the entire verification for an artefact that had lost them, and
          # report green -- the one false positive this job exists to avoid.
          # Only the numeric core is compared, so a prerelease such as
          # 1.1.0-rc1 counts as the 1.1.0 line instead of sorting below it.
          core="$(printf '%s' "$version" | sed 's/[-+].*//')"
          case "$core" in
            ''|*[!0-9.]*)
              echo "::error::'$tag' is not a version tag, so TLS applicability cannot be decided"
              exit 1
              ;;
          esac
          first="$(printf '%s\n%s\n' "1.1.0" "$core" | sort -V | head -1)"
          if [ "$first" = "1.1.0" ]; then
            tls_expected=true
          else
            tls_expected=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tls_expected=$tls_expected" >> "$GITHUB_OUTPUT"
          echo "release:        $tag"
          echo "deploy version: $version"
          echo "version core:   $core"
          if [ "$tls_expected" = "true" ]; then
            echo "TLS edge:       shipped in this release line, so the HTTPS job must run and must pass"
          else
            echo "TLS edge:       predates 1.1.0, so there is no TLS vhost in this bundle"
            echo "::notice::$tag predates the TLS edge (first shipped in v1.1.0); the HTTPS clean-host job is not applicable and is skipped. Its HTTP verification above is unchanged."
          fi

  # ------------------------------------------------------- clean host, TLS --
  clean-host-tls:
    name: Deploy a release over HTTPS on a clean host
    runs-on: ubuntu-latest
    needs: [release-facts]
    # Skipped, not failed, for releases that predate the TLS edge: v1.0.x is
    # immutable and was verified over HTTP, and asserting TLS against it
    # would be retrofitting an expectation the artefact never claimed.
    if: needs.release-facts.outputs.tls_expected == 'true'
    env:
      EDGE: https://localhost
      EDGE_HTTP: http://localhost
      # Paths, relative to the workspace root. The certificate doubles as the
      # trust anchor for curl and python. The key path is named only so that
      # teardown can destroy it; its contents are never read.
      CA: host/nginx/certs/fullchain.pem
      KEY: host/nginx/certs/privkey.pem
    steps:
      - name: The runner holds no repository checkout
        run: |
          # The point of the whole job: if anything is here, a later step
          # could read nginx/, the TLS vhost or the Makefile from it instead
          # of from the bundle, and a green result would prove nothing.
          leftovers="$(ls -A . 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::error::workspace is not empty, so the bundle would not be the only source: $leftovers"
            exit 1
          fi
          echo "workspace is bare; the published bundle will be the only source of files"

      - name: Download only the deployment bundle
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.release-facts.outputs.tag }}" --repo "${{ github.repository }}" --pattern 'deploy-*.tar.gz' --dir "$RUNNER_TEMP"
          bundle="$(ls "$RUNNER_TEMP"/deploy-*.tar.gz | head -1)"
          # The pipeline exits with head's status, so a failing ls would not
          # abort the step -- it would leave this empty and fail several lines
          # later, in a place that reads like a different problem.
          if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
            echo "::error::no deploy-*.tar.gz asset was downloaded for ${{ needs.release-facts.outputs.tag }}"
            exit 1
          fi
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          ls -l "$bundle"
          sha256sum "$bundle"

      - name: Inspect the bundle before anything is deployed
        env:
          BUNDLE: ${{ steps.download.outputs.bundle }}
        run: |
          mkdir host
          tar -xzf "$BUNDLE" -C host
          echo "--- everything the host now has ---"
          find host -mindepth 1 | sort
          echo
          echo "--- every path the deployment needs must be present ---"
          # The HTTP set, plus the three files the TLS edge is made of. No
          # conditional tolerance here: release-facts already established
          # that this release line ships them.
          missing=0
          for path in docker-compose.prod.yml .env.prod.example Makefile \
                      nginx/nginx.conf \
                      nginx/conf.d/researchsphere.conf \
                      nginx/conf.d/locations.inc \
                      nginx/tls/researchsphere-tls.conf \
                      nginx/certs; do
            if [ -e "host/$path" ]; then
              echo "  OK      $path"
            else
              echo "  MISSING $path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::the published bundle cannot deploy a TLS edge: required paths are absent"
            exit 1
          fi
          echo
          echo "--- and it must carry no key material of its own ---"
          # The release workflow guards this on the way out; this is the same
          # assertion made from the consumer side, on the published bytes.
          leaked="$(find host -type f \( -iname '*.pem' -o -iname '*.key' \
            -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.p12' -o -iname '*.pfx' \
            -o -iname '*privkey*' -o -iname '*fullchain*' \) -print 2>/dev/null || true)"
          if [ -n "$leaked" ]; then
            echo "::error::the published bundle contains certificate or key material:"
            printf '%s\n' "$leaked"
            exit 1
          fi
          echo "  no certificate or key material in the bundle"
          if [ ! -f host/nginx/certs/.gitkeep ]; then
            echo "::error::nginx/certs has no .gitkeep, so the mount point may not survive packaging"
            exit 1
          fi
          stray="$(find host/nginx/certs -type f -not -name .gitkeep | wc -l)"
          if [ "$stray" -ne 0 ]; then
            echo "::error::nginx/certs holds files other than .gitkeep"
            exit 1
          fi
          echo "  nginx/certs is an empty mount point holding only .gitkeep"
          echo
          echo "bundle accepted for deployment"

      - name: Compose a throwaway .env.prod with https origins
        working-directory: host
        env:
          IMAGE_TAG: ${{ needs.release-facts.outputs.version }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import secrets

          # https origins, unlike the HTTP job's: the realtime endpoint checks
          # the WebSocket Origin against CORS_ORIGINS, and a browser sends the
          # page's own scheme. http values here would fail the wss handshake
          # for the right reason but the wrong test.
          #
          # The template is the one inside the bundle. ENVIRONMENT is not set
          # here on purpose: docker-compose.prod.yml fixes it to production,
          # and the HSTS assertions below depend on that rather than on
          # anything this job supplies.
          values = {
              "SECRET_KEY": base64.b64encode(secrets.token_bytes(48)).decode(),
              "POSTGRES_PASSWORD": secrets.token_hex(24),
              "REDIS_PASSWORD": secrets.token_hex(24),
              "GEMINI_API_KEY": "ci-not-a-real-key",
              "FRONTEND_URL": "https://localhost",
              "CORS_ORIGINS": "https://localhost",
              "TRUSTED_HOSTS": "localhost",
              # A published version, never "local": the images must come from
              # the registry, not from a build.
              "IMAGE_TAG": os.environ["IMAGE_TAG"],
          }
          out, seen = [], set()
          for line in pathlib.Path(".env.prod.example").read_text().splitlines():
              key = line.split("=", 1)[0] if ("=" in line and not line.startswith("#")) else None
              if key in values:
                  out.append(key + "=" + values[key])
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in values.items():
              if key not in seen:
                  out.append(key + "=" + value)
          pathlib.Path(".env.prod").write_text(chr(10).join(out) + chr(10))

          print("keys written (values withheld):")
          for line in out:
              if "=" in line and not line.startswith("#"):
                  print("  " + line.split("=", 1)[0])
          PY

      - name: Generate an ephemeral certificate into the bundle's mount point
        run: |
          # Self-signed, two days, and never leaves this runner. The SAN is
          # what lets curl and python verify the hostname instead of having
          # verification turned off, and basicConstraints CA:TRUE is needed
          # because the same file is both the server certificate and the trust
          # anchor presented to those clients.
          # It is written into the bundle's own nginx/certs, which is the
          # directory docker-compose.prod.yml bind-mounts -- the same action an
          # operator takes with a real certificate.
          # stderr stays visible: openssl writes key-generation progress
          # there, never key material.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -sha256 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -addext "basicConstraints=critical,CA:TRUE" -keyout "$KEY" -out "$CA"
          chmod 600 "$KEY"
          # Safe properties only. The key is never read, printed or hashed.
          test -s "$KEY" || { echo "::error::no private key produced"; exit 1; }
          test -s "$CA" || { echo "::error::no certificate produced"; exit 1; }
          echo "certificate generated at $CA:"
          openssl x509 -in "$CA" -noout -subject -issuer -enddate
          openssl x509 -in "$CA" -noout -ext subjectAltName
          openssl x509 -in "$CA" -noout -fingerprint -sha256
          echo "private key present: $(test -f "$KEY" && echo yes), contents never displayed"

      - name: Enable the bundle's TLS vhost the way the docs instruct
        id: vhost
        working-directory: host
        run: |
          # Exactly the two file operations in docs/DEPLOYMENT.md section 9,
          # against the files that came out of the tarball. server_name is
          # already `_`, so the copy needs no edit and stays byte-identical to
          # what was published -- which is what the container check later
          # compares against.
          cp nginx/tls/researchsphere-tls.conf nginx/conf.d/
          rm nginx/conf.d/researchsphere.conf
          echo "conf.d now contains:"
          ls -1 nginx/conf.d
          count="$(ls -1 nginx/conf.d/*.conf | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one active vhost, found $count; nginx refuses two default servers on port 80"
            exit 1
          fi
          src="$(sha256sum nginx/tls/researchsphere-tls.conf | cut -d' ' -f1)"
          dst="$(sha256sum nginx/conf.d/researchsphere-tls.conf | cut -d' ' -f1)"
          echo "published TLS vhost sha256: $src"
          # Both substitutions end in `cut`, so a failing sha256sum would
          # leave them empty and compare equal.
          if [ -z "$src" ] || [ -z "$dst" ]; then
            echo "::error::could not checksum the TLS vhost"
            exit 1
          fi
          if [ "$src" != "$dst" ]; then
            echo "::error::the activated vhost is not a faithful copy of the published one"
            exit 1
          fi
          echo "tls_conf_sha=$src" >> "$GITHUB_OUTPUT"
          # The routes must still come from the shared include, not be copied
          # into the TLS vhost.
          if grep -q "proxy_pass http://frontend_upstream" nginx/conf.d/researchsphere-tls.conf; then
            echo "::error::the TLS vhost duplicates the application routing instead of including it"
            exit 1
          fi
          includes="$(grep -c "include /etc/nginx/conf.d/locations.inc;" nginx/conf.d/researchsphere-tls.conf || true)"
          echo "locations.inc included $includes time(s) by the TLS vhost"
          if [ "$includes" -lt 1 ]; then
            echo "::error::the TLS vhost does not include the shared routes"
            exit 1
          fi

      - name: Uncomment the 443 mapping, as the docs instruct
        working-directory: host
        run: |
          # The remaining documented step. Unlike the source-tree TLS job in
          # ci.yml, which must not edit the committed compose file and so adds
          # 443 through an overlay, this host owns its copy -- so the real
          # instruction is exercised, and a typo in that commented line would
          # be caught here and nowhere else.
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("docker-compose.prod.yml")
          commented = '      # - "${HTTPS_PORT:-443}:443"'
          enabled = '      - "${HTTPS_PORT:-443}:443"'

          lines = path.read_text().splitlines()
          hits = [i for i, line in enumerate(lines) if line == commented]
          if len(hits) != 1:
              sys.exit(
                  "expected exactly one commented 443 mapping to uncomment, found %d; "
                  "the documented procedure no longer matches the bundle" % len(hits)
              )
          lines[hits[0]] = enabled
          path.write_text(chr(10).join(lines) + chr(10))
          print("uncommented line %d:" % (hits[0] + 1))
          print("  before: %s" % commented)
          print("  after:  %s" % enabled)
          PY
          echo "--- the nginx ports block now reads ---"
          sed -n '/^  nginx:/,/^    volumes:/p' docker-compose.prod.yml | sed -n '/ports:/,$p'

      - name: Compose parses the bundle, with 443 published
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
          echo "docker-compose.prod.yml parses with no overlay and no source tree"
          # The resolved config as text rather than --format json: the
          # long-form `published:` key is emitted by every Compose v2, while
          # the json formatter is not on every runner image.
          resolved="$(docker compose -f docker-compose.prod.yml --env-file .env.prod config)"
          echo "--- the resolved port mappings ---"
          printf '%s\n' "$resolved" | grep -E "published:|target:" || true
          # Anchored at end of line, so `published: "8080"` cannot satisfy a
          # check for port 80.
          for port in 80 443; do
            if printf '%s\n' "$resolved" | grep -qE "published: \"?$port\"?$"; then
              echo "  $port is published"
            else
              echo "::error::$port is not published by the bundle's compose file"
              exit 1
            fi
          done
          echo "both 80 and 443 are published by the bundle's own compose file"

      - name: Pull the published images from GHCR
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull

      - name: The pulled images came from GHCR at this version
        working-directory: host
        env:
          VERSION: ${{ needs.release-facts.outputs.version }}
        run: |
          failed=0
          for name in backend frontend; do
            ref="ghcr.io/kasirayapudi/researchsphere-ai/$name:$VERSION"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref" 2>/dev/null || true)"
            if [ -z "$digest" ]; then
              echo "::error::$ref is not present locally after the pull"
              failed=1
              continue
            fi
            echo "$name -> $digest"
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "both application images were pulled from GHCR at $VERSION"

      - name: Start the datastores and migrate
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build postgres redis qdrant
          pending="not checked"
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pending=""
            for s in postgres redis qdrant; do
              cid="$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q "$s")"
              if [ -z "$cid" ]; then
                pending="$pending $s=absent"
                continue
              fi
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
              if [ "$state" != "healthy" ]; then
                pending="$pending $s=$state"
              fi
            done
            if [ -z "$pending" ]; then
              echo "datastores healthy"
              break
            fi
            echo "waiting:$pending"
            sleep 5
          done
          if [ -n "$pending" ]; then
            echo "::error::datastores did not become healthy:$pending"
            exit 1
          fi
          docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend migrate

      - name: Start the full stack
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

      - name: Every service reports healthy
        working-directory: host
        run: |
          services="nginx frontend backend worker beat postgres qdrant redis"
          pending="not checked"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pending=""
            for s in $services; do
              cid="$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q "$s")"
              if [ -z "$cid" ]; then
                pending="$pending $s=absent"
                continue
              fi
              state="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
              if [ "$state" != "healthy" ]; then
                pending="$pending $s=$state"
              fi
            done
            if [ -z "$pending" ]; then
              echo "all 8 services healthy, with the TLS vhost active"
              docker compose -f docker-compose.prod.yml --env-file .env.prod ps
              exit 0
            fi
            echo "waiting:$pending"
            sleep 5
          done
          echo "::error::services did not become healthy:$pending"
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          exit 1

      - name: nginx is running the published bundle's TLS configuration
        working-directory: host
        env:
          EXPECTED_SHA: ${{ steps.vhost.outputs.tls_conf_sha }}
        run: |
          echo "--- 1. the workspace still holds nothing but the unpacked bundle ---"
          entries="$(ls -A "$GITHUB_WORKSPACE" | tr '\n' ' ')"
          echo "  workspace: $entries"
          if [ "$(ls -A "$GITHUB_WORKSPACE" | wc -l)" -ne 1 ] || [ ! -d "$GITHUB_WORKSPACE/host" ]; then
            echo "::error::something other than the unpacked bundle appeared in the workspace"
            exit 1
          fi
          repo="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name .git -print 2>/dev/null || true)"
          if [ -n "$repo" ]; then
            echo "::error::a Git repository is present, so configuration could have come from a checkout: $repo"
            exit 1
          fi
          echo "  no checkout exists anywhere; the bundle is the only possible source"

          echo "--- 2. the file nginx loaded is byte-identical to the published one ---"
          cid="$(docker compose -f docker-compose.prod.yml --env-file .env.prod ps -q nginx)"
          if [ -z "$cid" ]; then
            echo "::error::the nginx container is not running"
            exit 1
          fi
          incontainer="$(docker exec "$cid" sha256sum /etc/nginx/conf.d/researchsphere-tls.conf | cut -d' ' -f1)"
          echo "  published bundle: $EXPECTED_SHA"
          echo "  inside nginx:     $incontainer"
          if [ "$incontainer" != "$EXPECTED_SHA" ]; then
            echo "::error::nginx is serving a different TLS configuration than the published bundle's"
            exit 1
          fi
          echo "  identical, so the running edge is configured by the published artefact"

          echo "--- 3. and the mounts resolve to the unpacked bundle ---"
          docker inspect -f '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' "$cid"
          foreign="$(docker inspect -f '{{range .Mounts}}{{if eq .Type "bind"}}{{.Source}}{{"\n"}}{{end}}{{end}}' "$cid" \
            | grep -v "^$GITHUB_WORKSPACE/host/nginx/" || true)"
          if [ -n "$foreign" ]; then
            echo "::error::a bind mount comes from outside the unpacked bundle:"
            printf '%s\n' "$foreign"
            exit 1
          fi
          echo "  every bind mount originates inside the unpacked bundle"

          echo "--- 4. the configuration nginx actually loaded is the TLS one ---"
          dump="$(docker exec "$cid" nginx -T 2>&1 || true)"
          if [ -z "$dump" ]; then
            echo "::error::nginx -T produced no output"
            exit 1
          fi
          # nginx -T dumps every file in full, comments included, and the
          # TLS vhost header comment names both researchsphere.conf and
          # Strict-Transport-Security while explaining why neither is used.
          # Directive checks therefore run against a comment-stripped copy,
          # with runs of whitespace squeezed so the needles stay exact
          # literals. The file-level check runs against the raw dump, where
          # only nginx itself emits "configuration file <path>".
          code="$(printf '%s\n' "$dump" | sed 's/#.*//' | tr -s '[:blank:]' ' ')"
          for needle in "listen 443 ssl" \
                        "ssl_certificate /etc/nginx/certs/fullchain.pem" \
                        "ssl_protocols TLSv1.2 TLSv1.3" \
                        "return 301 https://" \
                        "location ^~ /api/v1/ws"; do
            if printf '%s\n' "$code" | grep -qF "$needle"; then
              echo "  present: $needle"
            else
              echo "::error::the running configuration does not contain: $needle"
              printf '%s\n' "$code" | grep -nE "listen|ssl_|return 301|location" | head -40
              exit 1
            fi
          done
          if printf '%s\n' "$dump" | grep -qF "configuration file /etc/nginx/conf.d/researchsphere.conf"; then
            echo "::error::the HTTP-only vhost is still loaded; two default servers on port 80 would conflict"
            exit 1
          fi
          echo "  the HTTP-only vhost is no longer loaded"
          # Strict-Transport-Security must not come from nginx; the
          # application owns it, and two headers would otherwise be sent.
          # Case-folded with tr and then matched as a fixed string, so the
          # check does not depend on grep -i and -F interacting -- a
          # combination that is not portable across grep builds, and which
          # fails open: a crashing grep exits non-zero and reads as
          # "no edge HSTS header", which is the answer this check must never
          # give by accident.
          lower="$(printf '%s\n' "$code" | tr 'A-Z' 'a-z')"
          if printf '%s\n' "$lower" | grep -qF "add_header strict-transport-security"; then
            echo "::error::the edge adds its own HSTS header; the application is the sole owner"
            exit 1
          fi
          echo "  the edge adds no HSTS header of its own"

      - name: Plain HTTP redirects, except health and ACME
        run: |
          echo "--- / must redirect, and must not be followed ---"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$EDGE_HTTP/")"
          target="$(curl -sS -o /dev/null -w '%{redirect_url}' "$EDGE_HTTP/")"
          echo "  GET / -> $code  Location: $target"
          if [ "$code" != "301" ]; then
            echo "::error::expected 301 from plain HTTP, got $code"
            exit 1
          fi
          case "$target" in
            https://localhost/*|https://localhost) echo "  redirect target is https on the same host" ;;
            *) echo "::error::unexpected redirect target: $target"; exit 1 ;;
          esac
          echo "--- a deep path keeps its URI ---"
          deep="$(curl -sS -o /dev/null -w '%{redirect_url}' "$EDGE_HTTP/api/v1/workspaces?x=1")"
          echo "  /api/v1/workspaces?x=1 -> $deep"
          case "$deep" in
            https://localhost/api/v1/workspaces?x=1) echo "  path and query preserved" ;;
            *) echo "::error::redirect did not preserve the request URI: $deep"; exit 1 ;;
          esac
          echo "--- /healthz stays on HTTP for the container healthcheck ---"
          hz="$(curl -sS -w ' [%{http_code}]' "$EDGE_HTTP/healthz")"
          echo "  /healthz -> $hz"
          case "$hz" in
            "ok [200]") echo "  edge health answered over plain HTTP" ;;
            *) echo "::error::/healthz over HTTP returned: $hz"; exit 1 ;;
          esac
          echo "--- the ACME challenge path is not redirected ---"
          acme="$(curl -sS -o /dev/null -w '%{http_code}' "$EDGE_HTTP/.well-known/acme-challenge/probe")"
          echo "  /.well-known/acme-challenge/probe -> $acme"
          if [ "$acme" = "301" ]; then
            echo "::error::the ACME challenge path is being redirected; renewal would break"
            exit 1
          fi
          echo "  not redirected (404 is expected: no challenge file is staged)"

      - name: HTTPS serves health, the SPA and the API through the edge
        run: |
          echo "--- the edge's own health over https ---"
          hz="$(curl -sS --cacert "$CA" -w ' [%{http_code}]' "$EDGE/healthz")"
          echo "  /healthz -> $hz"
          case "$hz" in
            "ok [200]") echo "  edge health answered over https as well" ;;
            *) echo "::error::/healthz over https returned: $hz"; exit 1 ;;
          esac
          echo "--- the SPA over https, with the certificate verified ---"
          body="$(curl -sS --cacert "$CA" "$EDGE/")"
          printf '%s' "$body" | grep -qi "<!doctype html"
          echo "  index.html over https: $(printf '%s' "$body" | wc -c) bytes"
          echo "--- API diagnostics and readiness through the edge ---"
          curl -sS --cacert "$CA" "$EDGE/api/health" | head -c 300
          echo
          ready="$(curl -sS --cacert "$CA" -o /dev/null -w '%{http_code}' "$EDGE/api/ready")"
          echo "  /api/ready -> $ready"
          if [ "$ready" != "200" ]; then
            echo "::error::readiness over https returned $ready"
            exit 1
          fi
          echo "--- and nothing silently fell back to http ---"
          # curl reports the scheme in upper case on some builds and lower on
          # others, so normalise before comparing. The assertion is unchanged:
          # anything but https still fails.
          scheme="$(curl -sS --cacert "$CA" -o /dev/null -w '%{scheme}' "$EDGE/" | tr 'A-Z' 'a-z')"
          echo "  effective scheme: $scheme"
          if [ "$scheme" != "https" ]; then
            echo "::error::request did not use https"
            exit 1
          fi

      - name: nginx presents the certificate that was generated
        run: |
          expected="$(openssl x509 -in "$CA" -noout -fingerprint -sha256 | sed 's/.*=//')"
          served="$(echo | openssl s_client -connect localhost:443 -servername localhost 2>/dev/null | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//')"
          echo "  expected fingerprint: $expected"
          echo "  served fingerprint:   $served"
          if [ "$expected" != "$served" ]; then
            echo "::error::nginx is serving a different certificate than the one generated"
            exit 1
          fi
          echo "  identity of the served certificate:"
          echo | openssl s_client -connect localhost:443 -servername localhost 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName
          echo "  negotiated protocol and cipher:"
          echo | openssl s_client -connect localhost:443 -servername localhost 2>/dev/null | grep -E "^(New|Protocol|Cipher)" | head -4

      - name: TLS 1.2 and 1.3 are accepted, 1.0 and 1.1 are not
        run: |
          probe() {
            echo | openssl s_client -connect localhost:443 -servername localhost "$1" 2>&1
          }
          # Two markers, because the output differs by OpenSSL version. The
          # SSL-Session block carries `Protocol :` only once a session exists:
          # TLS 1.2 establishes one during the handshake, but TLS 1.3 gets its
          # session from a post-handshake ticket that never arrives here
          # because `echo` closes stdin at once -- so OpenSSL 3.0 on the
          # runner prints no session block for 1.3 while 3.5 does. `New,
          # TLSv1.x,` is printed immediately after the handshake either way
          # and names the negotiated version. With -tls1_3 the client offers
          # nothing else, so a completed handshake is proof of 1.3.
          #
          # Each probe runs once and is captured, so the assertion and the
          # diagnostic see the same output.
          for v in -tls1_2 -tls1_3; do
            out="$(probe "$v" || true)"
            if printf '%s' "$out" | grep -qE "New, TLSv1\.[23],|Protocol *: *TLSv1\.[23]"; then
              echo "  accepted: $v ($(printf '%s' "$out" | grep -oE 'New, TLSv1\.[0-9]' | head -1))"
            else
              echo "::error::$v was refused but should be accepted"
              printf '%s\n' "$out" | tail -40
              exit 1
            fi
          done
          # Ubuntu's OpenSSL 3 refuses TLS 1.0/1.1 in its own default config,
          # so a bare probe would fail client-side and prove nothing about
          # nginx. This config re-enables them for the client only, so what we
          # observe is the server's rejection.
          cat > "$RUNNER_TEMP/openssl-legacy.cnf" <<'CNF'
          openssl_conf = default_conf
          [default_conf]
          ssl_conf = ssl_sect
          [ssl_sect]
          system_default = system_default_sect
          [system_default_sect]
          MinProtocol = None
          MaxProtocol = None
          CipherString = DEFAULT:@SECLEVEL=0
          CNF
          for v in -tls1 -tls1_1; do
            # `|| true` is required, not laxity: openssl exits non-zero when
            # the server refuses the protocol, which is the outcome being
            # asserted, and under `bash -e` a failing command substitution
            # would abort the step before the checks below ever ran.
            out="$(OPENSSL_CONF="$RUNNER_TEMP/openssl-legacy.cnf" probe "$v" || true)"
            # The negotiated cipher, not the Protocol field. OpenSSL prints
            # `Protocol  : TLSv1` for the version the client *attempted*, even
            # when the server refused it, so only a real cipher proves a
            # handshake completed: `Cipher is [^(]` separates
            # `Cipher is ECDHE-...` from `Cipher is (NONE)`.
            if printf '%s' "$out" | grep -qE "New, TLSv1(\.[01])?, Cipher is [^(]"; then
              echo "::error::$v completed a handshake; obsolete TLS is enabled"
              printf '%s\n' "$out" | tail -40
              exit 1
            fi
            if echo "$out" | grep -qiE "no protocols available|unsupported protocol"; then
              echo "::error::$v could not be offered by this OpenSSL even with the legacy config, so the server's behaviour was not tested"
              echo "$out" | tail -5
              exit 1
            fi
            echo "  rejected: $v ($(echo "$out" | grep -oiE "alert [a-z ]+|handshake failure|no cipher" | head -1))"
          done

      - name: HSTS is sent over HTTPS only, without includeSubDomains
        run: |
          echo "--- https ---"
          hdr="$(curl -sS --cacert "$CA" -D - -o /dev/null "$EDGE/api/health")"
          count="$(printf '%s' "$hdr" | grep -ci '^strict-transport-security:' || true)"
          value="$(printf '%s' "$hdr" | grep -i '^strict-transport-security:' | head -1)"
          echo "  headers found: $count"
          echo "  $value"
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one Strict-Transport-Security header over https, found $count"
            exit 1
          fi
          case "$value" in
            *max-age=*) : ;;
            *) echo "::error::HSTS header has no max-age"; exit 1 ;;
          esac
          if printf '%s' "$value" | grep -qi "includeSubDomains"; then
            echo "::error::includeSubDomains is present; it must be opt-in"
            exit 1
          fi
          if printf '%s' "$value" | grep -qi "preload"; then
            echo "::error::preload is present; it must stay off"
            exit 1
          fi
          echo "  one header, max-age set, no includeSubDomains, no preload"
          echo "--- plain http must carry none ---"
          httphdr="$(curl -sS -D - -o /dev/null "$EDGE_HTTP/healthz")"
          if printf '%s' "$httphdr" | grep -qi '^strict-transport-security:'; then
            echo "::error::HSTS was sent over plain http"
            printf '%s' "$httphdr" | grep -i '^strict-transport-security:'
            exit 1
          fi
          echo "  no HSTS over http, as intended"

      - name: Security headers survive the TLS edge
        run: |
          hdr="$(curl -sS --cacert "$CA" -D - -o /dev/null "$EDGE/api/health")"
          for h in x-content-type-options x-frame-options referrer-policy permissions-policy content-security-policy; do
            line="$(printf '%s' "$hdr" | grep -i "^$h:" | head -1)"
            if [ -z "$line" ]; then
              echo "::error::missing $h on the https API response"
              exit 1
            fi
            echo "  $line"
          done
          # The SPA is served by the frontend container's own nginx, which sets
          # no CSP. Existing behaviour, recorded rather than changed here: with
          # no page CSP there is no connect-src to block wss, and the wss
          # assertion below is the real proof.
          spa="$(curl -sS --cacert "$CA" -D - -o /dev/null "$EDGE/")"
          if printf '%s' "$spa" | grep -qi '^content-security-policy:'; then
            echo "  SPA sends a CSP:"
            printf '%s' "$spa" | grep -i '^content-security-policy:'
          else
            echo "  SPA sends no CSP (existing behaviour; nothing can block wss)"
          fi

      - name: HTTPS authentication, WSS, and the SSE proxy path
        run: |
          python3 -m pip install --quiet "websockets==12.0"
          python3 - <<'PY'
          import asyncio
          import json
          import os
          import secrets
          import ssl
          import sys
          import urllib.error
          import urllib.request

          import websockets

          EDGE = "https://localhost"
          CA = os.environ["CA"]
          UPPER = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          LOWER = "abcdefghijkmnopqrstuvwxyz"
          DIGIT = "23456789"
          SPECIAL = "!@#%^&*"

          # Trust only the certificate this job generated, with hostname
          # checking left on -- so a wrong or missing SAN fails the test
          # rather than passing silently.
          ctx = ssl.create_default_context(cafile=CA)
          assert ctx.verify_mode == ssl.CERT_REQUIRED and ctx.check_hostname


          def password():
              # Mirrors the backend policy: alternate a letter and a
              # non-letter so no run of repeats or sequences can form.
              out = []
              for pair in range(8):
                  out.append(secrets.choice(UPPER if pair % 2 == 0 else LOWER))
                  out.append(secrets.choice(DIGIT if pair % 2 == 0 else SPECIAL))
              return "".join(out)


          def call(path, payload=None, token=None, raw=False):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(EDGE + path, data=data)
              req.add_header("Content-Type", "application/json")
              req.add_header("Origin", EDGE)
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              try:
                  response = urllib.request.urlopen(req, timeout=60, context=ctx)
                  return response if raw else json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  if raw:
                      return exc
                  sys.exit("%s failed: HTTP %s %s" % (path, exc.code, exc.read().decode()[:300]))

          marker = secrets.token_hex(6)
          created = call("/api/v1/auth/signup", {
              "name": "Clean Host TLS Probe",
              # example.com, never a .test address: .test is a reserved
              # special-use TLD (RFC 6761) and email-validator, which backs
              # pydantic EmailStr, rejects it outright -- signup would answer
              # 422 and the probe would never reach the socket.
              "email": "clean-host-tls-%s@example.com" % marker,
              "password": password(),
          })
          token = created["access_token"]
          print("HTTPS signup succeeded through the published bundle's edge")
          print("  token segments: %d" % (token.count(".") + 1))

          workspace_id = call("/api/v1/workspaces", token=token)[0]["id"]
          print("HTTPS authenticated read succeeded; workspace %s" % workspace_id)


          async def probe():
              url = "wss://localhost/api/v1/ws?workspace_id=%s" % workspace_id
              assert url.startswith("wss://"), "the test must not use ws://"
              async with websockets.connect(
                  url,
                  subprotocols=["bearer", token],
                  origin=EDGE,
                  ssl=ctx,
                  open_timeout=30,
                  close_timeout=5,
              ) as socket:
                  tls = socket.transport.get_extra_info("ssl_object")
                  if tls is None:
                      sys.exit("the socket is not TLS; it must not downgrade to ws://")
                  print("WSS handshake completed through nginx")
                  print("  TLS version: %s" % tls.version())
                  print("  cipher: %s" % (tls.cipher()[0],))
                  print("  negotiated subprotocol: %r" % socket.subprotocol)
                  if socket.subprotocol != "bearer":
                      sys.exit("the server did not echo the bearer subprotocol")
                  raw = await asyncio.wait_for(socket.recv(), timeout=30)
                  return json.loads(raw), tls.version()

          event, tls_version = asyncio.run(probe())
          if not isinstance(event, dict) or event.get("type") != "connection.ready":
              sys.exit("expected connection.ready as the first frame, got %r" % (event,))
          print("first frame over wss: %s" % json.dumps(event)[:200])
          print("connection.ready received over wss")

          # SSE through the TLS edge. The Gemini key here is not real, so
          # generation cannot be asserted -- what is asserted is the proxy
          # path: the request reaches the backend through nginx over https
          # (the backend's X-Request-ID proves it was not answered by nginx),
          # and the response is unbuffered, which is what the SSE location's
          # proxy_buffering off and chunked_transfer_encoding exist for.
          # The field is `prompt` -- ChatQuery in app/api/v1/chat.py. Sending
          # the wrong name would answer 422 with a Content-Length, which the
          # buffering check below would misreport as nginx buffering the
          # stream. StreamingResponse is returned before the generator runs,
          # so the status is 200 and the fake key surfaces as stream content
          # rather than an error code.
          sse = call("/api/v1/chat/stream",
                     {"prompt": "tls probe", "workspace_id": workspace_id},
                     token=token, raw=True)
          status = getattr(sse, "status", None) or getattr(sse, "code", None)
          headers = {k.lower(): v for k, v in sse.headers.items()}
          print("SSE proxy path: HTTP %s" % status)
          print("  content-type: %s" % headers.get("content-type"))
          print("  transfer-encoding: %s" % headers.get("transfer-encoding"))
          print("  content-length: %s" % headers.get("content-length"))
          if "x-request-id" not in headers:
              sys.exit("no X-Request-ID: the response did not come from the backend")
          if status in (502, 503, 504):
              sys.exit("nginx could not reach the backend for the SSE route: %s" % status)
          if "content-length" in headers:
              sys.exit("the SSE response carried Content-Length (HTTP %s, %s), so it was "
                       "not streamed; either nginx buffered it or the backend answered with "
                       "a non-streaming body" % (status, headers.get("content-type")))
          print("  reached the backend through nginx, unbuffered")
          print("::notice::Published bundle verified over TLS: %s, certificate verified, "
                "connection.ready over wss, SSE proxy path unbuffered" % tls_version)
          PY

      - name: The datastores and the application ports are not on the host
        run: |
          for port in 5432 6379 6333 8000 8080; do
            if curl --silent --max-time 3 "http://127.0.0.1:$port" > /dev/null 2>&1; then
              echo "::error::port $port answered on the host; it must not be published"
              exit 1
            fi
            echo "  port $port is not reachable from the host, as intended"
          done
          echo "  reachable edge ports: 80 (redirect/health) and 443 (application)"

      - name: The key material stayed where it was put
        env:
          BUNDLE: ${{ steps.download.outputs.bundle }}
        run: |
          # The Git assertions in ci.yml's TLS job do not apply here and are
          # deliberately not imitated: this runner has no checkout, so there
          # is no index the key could enter. What is assertable instead:
          echo "--- the published tarball itself carries no key material ---"
          if tar -tzf "$BUNDLE" | grep -iE '\.(pem|key|crt|cer|p12|pfx)$|privkey|fullchain'; then
            echo "::error::the published bundle contains certificate or key material"
            exit 1
          fi
          echo "  nothing in $(basename "$BUNDLE")"
          echo "--- the key exists at exactly one path in the workspace ---"
          found="$(find "$GITHUB_WORKSPACE" -type f \( -iname '*privkey*' -o -iname '*.key' \) -print | sort)"
          printf '%s\n' "$found"
          if [ "$found" != "$GITHUB_WORKSPACE/$KEY" ]; then
            echo "::error::private key material is not confined to $KEY"
            exit 1
          fi
          echo "  confined to the bind-mounted certs directory"
          echo "--- and nothing in this job uploads it ---"
          # No actions/upload-artifact step exists in this job; the only
          # copies are the one above and the read-only mount inside nginx.
          echo "  no artefact upload step exists; teardown destroys the key"

      - name: Clean-host TLS verification summary
        run: |
          echo "Verified against the published deploy-${{ needs.release-facts.outputs.version }}.tar.gz,"
          echo "on a runner with no repository checkout, with the images pulled from GHCR."
          echo "Every line below corresponds to an assertion that ran and passed in the"
          echo "steps above; a failure would have stopped the job there."
          echo
          echo "  Bundle was the only source of deployment files   PASS"
          echo "  Bundle contents verified before deployment       PASS"
          echo "  Bundle carried no certificate or key material    PASS"
          echo "  TLS vhost activated by the documented procedure  PASS"
          echo "  443 published by uncommenting the documented line PASS"
          echo "  Images pulled from GHCR at this version          PASS"
          echo "  Eight services healthy                           PASS"
          echo "  nginx config byte-identical to the published one PASS"
          echo "  Every bind mount originates in the bundle        PASS"
          echo "  HTTP -> HTTPS redirect (301, URI preserved)      PASS"
          echo "  ACME challenge path exempt from redirect         PASS"
          echo "  HTTP /healthz                                    PASS"
          echo "  HTTPS /healthz                                   PASS"
          echo "  HTTPS SPA (certificate verified)                 PASS"
          echo "  HTTPS /api/health                                PASS"
          echo "  HTTPS /api/ready                                 PASS"
          echo "  HTTPS authentication (signup + bearer read)      PASS"
          echo "  WSS /api/v1/ws (TLS, no ws:// downgrade)         PASS"
          echo "  WebSocket connection.ready                       PASS"
          echo "  SSE proxy path (backend reached, unbuffered)     PASS"
          echo "  Certificate identity (fingerprint match)         PASS"
          echo "  TLS 1.2 accepted                                 PASS"
          echo "  TLS 1.3 accepted                                 PASS"
          echo "  TLS 1.0 rejected by the server                   PASS"
          echo "  TLS 1.1 rejected by the server                   PASS"
          echo "  HSTS over HTTPS, exactly one header              PASS"
          echo "  No HSTS over HTTP                                PASS"
          echo "  No includeSubDomains, no preload                 PASS"
          echo "  Edge adds no competing HSTS header               PASS"
          echo "  Security headers present over TLS                PASS"
          echo "  Datastore and application ports not on the host  PASS"
          echo "  Key material confined and destroyed at teardown  PASS"
          echo
          echo "Not asserted here: SSE token generation (the Gemini key used is not"
          echo "real), and certificate issuance or renewal, which is not implemented"
          echo "- see gap 2 in docs/DEPLOYMENT.md."

      - name: Stack state, logs and TLS diagnostics
        if: always()
        working-directory: host
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
          echo "--- nginx log ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=80 nginx || true
          echo "--- backend log ---"
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail=80 backend || true
          echo "--- certificate metadata (no key) ---"
          openssl x509 -in "$GITHUB_WORKSPACE/$CA" -noout -subject -enddate -fingerprint -sha256 2>/dev/null || true
          echo "--- handshake ---"
          echo | openssl s_client -connect localhost:443 -servername localhost 2>&1 | grep -E "^(New|Protocol|Cipher|Verify)" || true

      - name: Tear down and destroy the certificate
        if: always()
        run: |
          if [ -f host/docker-compose.prod.yml ]; then
            # A subshell, so the project directory -- and therefore the
            # Compose project name -- is identical to the steps that started
            # the stack. Deliberately not working-directory: host, because
            # this step must still destroy the key if the bundle never
            # unpacked and that directory does not exist.
            ( cd host && docker compose -f docker-compose.prod.yml --env-file .env.prod down -v --remove-orphans ) || true
          fi
          # shred rather than rm, and never read the file.
          shred -u "$KEY" 2>/dev/null || rm -f "$KEY"
          rm -f "$CA"
          rm -f "$RUNNER_TEMP/openssl-legacy.cnf"
          if [ -d host/nginx/certs ]; then
            echo "nginx/certs now holds:"
            ls -A host/nginx/certs
            remaining="$(find host/nginx/certs -type f -not -name .gitkeep | wc -l)"
            if [ "$remaining" -ne 0 ]; then
              echo "::error::certificate material survived cleanup"
              exit 1
            fi
          fi
          echo "certificate and key destroyed"
