name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true

permissions:
  contents: write      # create the release and push notes
  packages: write      # publish images to GHCR
  id-token: write      # sign the attestation
  attestations: write  # store it; attest-build-provenance needs both

env:
  REGISTRY: ghcr.io
  # OCI repository names must be lowercase, and github.repository is not
  # ("KasiRayapudi/ResearchSphere-AI"). docker/metadata-action lowercases what
  # it is given, but nothing else does, so the name is written out once here
  # and used everywhere the registry path is needed. It is a literal because
  # GitHub Actions expressions have no lowercase function, and because
  # docker-compose.prod.yml has to carry the same name verbatim -- keep the
  # two in step.
  IMAGE_NAMESPACE: kasirayapudi/researchsphere-ai

jobs:
  # Nothing is published unless the full test suite passes on the tagged
  # commit; a green CI run on main is not proof that the tag is good.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test
          npm run build

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          # G9 -- the tag contract, stated once:
          #   git tag v1.2.0  ->  1.2.0, 1.2, 1, sha-<40 hex>
          # There is deliberately no `latest`, and keeping it out takes the
          # `flavor` input below -- leaving it out of `tags:` is not enough.
          # `flavor` defaults to `latest=auto`, which appends `latest` for any
          # non-prerelease semver tag independently of the tag list, so v1.0.0
          # published one although no `latest` rule was ever listed here. The
          # `type=raw,value=latest,enable={{is_default_branch}}` rule this
          # workflow once carried was indeed dead -- it runs only on tags --
          # but removing it never disabled the flavour default. Production
          # selects a release explicitly with IMAGE_TAG -- see
          # .env.prod.example.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: true
          sbom: true

      # Lets consumers verify the image was built by this workflow from this
      # commit, rather than pushed by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          # Lowercase, like the images above: this is pushed to the registry
          # (push-to-registry below), and a registry rejects a repository name
          # that is not lowercase.
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is needed to build the changelog

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..${{ steps.version.outputs.tag }}"
            echo "Changes since $PREVIOUS"
          else
            RANGE="${{ steps.version.outputs.tag }}"
            echo "First release"
          fi

          {
            echo "## What changed"
            echo ""
            # Group by conventional-commit type; anything unprefixed lands in
            # "Other", which keeps the changelog honest rather than dropping it.
            for pair in "feat:Features" "fix:Fixes" "perf:Performance" \
                        "refactor:Refactoring" "docs:Documentation" \
                        "test:Tests" "build:Build" "ci:CI" "chore:Chores"; do
              type="${pair%%:*}"
              heading="${pair##*:}"
              entries="$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' \
                          --grep="^${type}(\|^${type}:" || true)"
              if [ -n "$entries" ]; then
                echo "### $heading"
                echo ""
                echo "$entries"
                echo ""
              fi
            done

            other="$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' \
                      --invert-grep \
                      --grep='^feat' --grep='^fix' --grep='^perf' --grep='^refactor' \
                      --grep='^docs' --grep='^test' --grep='^build' --grep='^ci' \
                      --grep='^chore' || true)"
            if [ -n "$other" ]; then
              echo "### Other"
              echo ""
              echo "$other"
              echo ""
            fi

            echo "## Container images"
            echo ""
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.version.outputs.version }}"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "## Deployment bundle"
            echo ""
            # Single-quoted so bash leaves the backticks alone; the version
            # expression is substituted by Actions before bash ever sees it.
            echo '`deploy-${{ steps.version.outputs.version }}.tar.gz` carries `docker-compose.prod.yml`,'
            echo '`.env.prod.example`, the `Makefile` and the `nginx/` tree -- everything a host'
            echo 'needs to run the images above. Unpack it into an empty deployment directory.'
            echo ""
            echo "See [docs/DEPLOYMENT.md](docs/DEPLOYMENT.md) for deployment instructions."
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Build frontend bundle for attachment
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../frontend-dist-${{ steps.version.outputs.version }}.tar.gz dist

      # G-R2 -- everything a host needs to run the published images, in one
      # archive. A flat release asset cannot carry a directory, and GitHub
      # rewrites a leading dot in an asset name, so `.env.prod.example`
      # attaches as `default.env.prod.example`; inside an archive neither
      # applies. `nginx/` goes in whole because the edge runs the stock nginx
      # image with no configuration of its own -- all three of its bind-mount
      # sources must exist on the host, and `certs/` must exist even with TLS
      # off or the mount fails. Deliberately absent: application source,
      # Dockerfiles and the build overlay, which the image-pull path never
      # reads, and `.env.prod`, which the operator writes from the example.
      # Fail closed before anything is packaged. `nginx/` is archived whole,
      # so a certificate or private key left in nginx/certs/ on the builder
      # would be published inside a release asset. Nothing should put one
      # there -- .gitignore excludes everything in that directory except
      # .gitkeep, and the TLS certificates are supplied on the deployment host
      # -- but the bundle is the wrong place to find out.
      - name: No TLS key material may enter the bundle
        run: |
          found="$(find nginx/certs -type f -not -name .gitkeep -print 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "::error::refusing to build the bundle: unexpected files under nginx/certs"
            printf '%s\n' "$found"
            exit 1
          fi
          # Belt and braces across the whole packaged tree, by extension and
          # by the names Let's Encrypt uses, so a key dropped outside certs/
          # is caught too.
          leaked="$(find docker-compose.prod.yml .env.prod.example Makefile nginx -type f \
            \( -iname '*.pem' -o -iname '*.key' -o -iname '*.crt' -o -iname '*.cer' \
               -o -iname '*.p12' -o -iname '*.pfx' -o -iname '*privkey*' \
               -o -iname '*fullchain*' \) -print 2>/dev/null || true)"
          if [ -n "$leaked" ]; then
            echo "::error::refusing to build the bundle: certificate or key material present"
            printf '%s\n' "$leaked"
            exit 1
          fi
          echo "no certificate or key material in the packaged tree"
          echo "nginx/certs holds only:"
          ls -A nginx/certs

      - name: Build deployment bundle for attachment
        run: |
          bundle="deploy-${{ steps.version.outputs.version }}.tar.gz"
          tar -czf "$bundle" docker-compose.prod.yml .env.prod.example Makefile nginx
          echo "Bundle contents:"
          tar -tzf "$bundle"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ResearchSphere AI ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') }}
          files: |
            deploy-${{ steps.version.outputs.version }}.tar.gz
            frontend-dist-${{ steps.version.outputs.version }}.tar.gz
            docker-compose.prod.yml
            .env.prod.example
