name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true

permissions:
  contents: write      # create the release and push notes
  packages: write      # publish images to GHCR
  id-token: write      # sign the attestation
  attestations: write  # store it; attest-build-provenance needs both

env:
  REGISTRY: ghcr.io
  # OCI repository names must be lowercase, and github.repository is not
  # ("KasiRayapudi/ResearchSphere-AI"). docker/metadata-action lowercases what
  # it is given, but nothing else does, so the name is written out once here
  # and used everywhere the registry path is needed. It is a literal because
  # GitHub Actions expressions have no lowercase function, and because
  # docker-compose.prod.yml has to carry the same name verbatim -- keep the
  # two in step.
  IMAGE_NAMESPACE: kasirayapudi/researchsphere-ai

jobs:
  # Nothing is published unless the full test suite passes on the tagged
  # commit; a green CI run on main is not proof that the tag is good.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test
          npm run build

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.prod
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          # G9 -- the tag contract, stated once:
          #   git tag v1.2.0  ->  1.2.0, 1.2, 1, sha-<40 hex>
          # There is deliberately no `latest`. This workflow runs only on tags
          # and workflow_dispatch, so the usual
          # `type=raw,value=latest,enable={{is_default_branch}}` line could
          # never fire; it was removed rather than left to imply a tag that is
          # never published. Production selects a release explicitly with
          # IMAGE_TAG -- see .env.prod.example.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          provenance: true
          sbom: true

      # Lets consumers verify the image was built by this workflow from this
      # commit, rather than pushed by hand.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          # Lowercase, like the images above: this is pushed to the registry
          # (push-to-registry below), and a registry rejects a repository name
          # that is not lowercase.
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is needed to build the changelog

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS="$(git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..${{ steps.version.outputs.tag }}"
            echo "Changes since $PREVIOUS"
          else
            RANGE="${{ steps.version.outputs.tag }}"
            echo "First release"
          fi

          {
            echo "## What changed"
            echo ""
            # Group by conventional-commit type; anything unprefixed lands in
            # "Other", which keeps the changelog honest rather than dropping it.
            for pair in "feat:Features" "fix:Fixes" "perf:Performance" \
                        "refactor:Refactoring" "docs:Documentation" \
                        "test:Tests" "build:Build" "ci:CI" "chore:Chores"; do
              type="${pair%%:*}"
              heading="${pair##*:}"
              entries="$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' \
                          --grep="^${type}(\|^${type}:" || true)"
              if [ -n "$entries" ]; then
                echo "### $heading"
                echo ""
                echo "$entries"
                echo ""
              fi
            done

            other="$(git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' \
                      --invert-grep \
                      --grep='^feat' --grep='^fix' --grep='^perf' --grep='^refactor' \
                      --grep='^docs' --grep='^test' --grep='^build' --grep='^ci' \
                      --grep='^chore' || true)"
            if [ -n "$other" ]; then
              echo "### Other"
              echo ""
              echo "$other"
              echo ""
            fi

            echo "## Container images"
            echo ""
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.version.outputs.version }}"
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "See [docs/DEPLOYMENT.md](docs/DEPLOYMENT.md) for deployment instructions."
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Build frontend bundle for attachment
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../frontend-dist-${{ steps.version.outputs.version }}.tar.gz dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ResearchSphere AI ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-rc') || contains(steps.version.outputs.tag, '-beta') }}
          files: |
            frontend-dist-${{ steps.version.outputs.version }}.tar.gz
            docker-compose.prod.yml
            .env.prod.example
